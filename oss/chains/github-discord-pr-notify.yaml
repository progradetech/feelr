name: github-discord-pr-notify
description: >-
  Fetches details of a GitHub pull request and posts a formatted notification
  to a Discord channel. Includes PR title, author, branch info, and merge status.
version: "1.0"
params:
  - name: repo
    type: string
    required: true
    description: GitHub repository in "owner/repo" format
  - name: pull_number
    type: number
    required: true
    description: Pull request number to fetch details for
  - name: channel_id
    type: string
    required: true
    description: Discord channel ID to post the notification to
retry:
  max_attempts: 2
  delay_seconds: 3
steps:
  - id: get_pr
    uses: github/pulls.get
    with:
      repo: "${{ params.repo }}"
      pull_number: "${{ params.pull_number }}"
  - id: post_discord
    uses: discord/messages.send
    with:
      channel_id: "${{ params.channel_id }}"
      content: "PR #${{ steps.get_pr.number }} in ${{ params.repo }}: **${{ steps.get_pr.title }}**\nAuthor: ${{ steps.get_pr.user_login }} | Branch: ${{ steps.get_pr.head_ref }} -> ${{ steps.get_pr.base_ref }}\nState: ${{ steps.get_pr.state }} | Merged: ${{ steps.get_pr.merged }}"
