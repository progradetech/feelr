<svg width="400" height="400" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#0a0a14" stroke="url(#logoGrad)" stroke-width="2.5"/>
  
  <!-- Lobster body - stylized rounded shape -->
  <ellipse cx="60" cy="72" rx="22" ry="18" fill="url(#bodyGrad)" opacity="0.9"/>
  <ellipse cx="60" cy="68" rx="18" ry="14" fill="url(#bodyGrad2)"/>
  
  <!-- Shell segments -->
  <path d="M45 65 Q60 58 75 65" stroke="#EF6B4A" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M47 71 Q60 64 73 71" stroke="#EF6B4A" stroke-width="1.5" fill="none" opacity="0.4"/>
  
  <!-- Claws - small and cute -->
  <path d="M38 68 Q30 62 28 55 Q26 50 32 52 Q36 54 38 60" fill="#E85D3A" stroke="#C94A2A" stroke-width="1"/>
  <path d="M82 68 Q90 62 92 55 Q94 50 88 52 Q84 54 82 60" fill="#E85D3A" stroke="#C94A2A" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="52" cy="60" r="4" fill="#1a1a2e"/>
  <circle cx="68" cy="60" r="4" fill="#1a1a2e"/>
  <circle cx="53" cy="59" r="1.8" fill="#34D399"/>
  <circle cx="69" cy="59" r="1.8" fill="#34D399"/>
  
  <!-- THE FEELRS (antennae) - the star of the show -->
  <!-- Left antenna - main stalk -->
  <path d="M50 56 Q42 38 28 22" stroke="url(#antennaGradL)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Left antenna - glow tip -->
  <circle cx="28" cy="22" r="5" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="28" cy="22" r="3" fill="#C4B5FD"/>
  <circle cx="28" cy="22" r="1.5" fill="#fff"/>
  
  <!-- Right antenna - main stalk -->
  <path d="M70 56 Q78 38 92 22" stroke="url(#antennaGradR)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Right antenna - glow tip -->
  <circle cx="92" cy="22" r="5" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="92" cy="22" r="3" fill="#C4B5FD"/>
  <circle cx="92" cy="22" r="1.5" fill="#fff"/>
  
  <!-- Smaller secondary antennae (antennules) -->
  <path d="M52 57 Q46 42 36 32" stroke="#8B5CF688" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="36" cy="32" r="2" fill="#8B5CF6" opacity="0.6"/>
  
  <path d="M68 57 Q74 42 84 32" stroke="#8B5CF688" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="84" cy="32" r="2" fill="#8B5CF6" opacity="0.6"/>
  
  <!-- Signal waves emanating from antenna tips -->
  <path d="M24 18 Q22 14 26 12" stroke="#C4B5FD" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M21 20 Q18 14 23 10" stroke="#C4B5FD" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M96 18 Q98 14 94 12" stroke="#C4B5FD" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M99 20 Q102 14 97 10" stroke="#C4B5FD" stroke-width="0.8" fill="none" opacity="0.3"/>
  
  <!-- Tail segments -->
  <path d="M48 86 Q60 94 72 86" stroke="#C94A2A" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M52 90 Q60 96 68 90" stroke="#C94A2A" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Legs - tiny -->
  <line x1="44" y1="78" x2="36" y2="84" stroke="#C94A2A" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="47" y1="80" x2="40" y2="88" stroke="#C94A2A" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="76" y1="78" x2="84" y2="84" stroke="#C94A2A" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="73" y1="80" x2="80" y2="88" stroke="#C94A2A" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="38" y1="54" x2="82" y2="90">
      <stop offset="0%" stop-color="#E85D3A"/>
      <stop offset="100%" stop-color="#C94A2A"/>
    </linearGradient>
    <linearGradient id="bodyGrad2" x1="42" y1="54" x2="78" y2="82">
      <stop offset="0%" stop-color="#F06B45"/>
      <stop offset="100%" stop-color="#D95535"/>
    </linearGradient>
    <linearGradient id="antennaGradL" x1="50" y1="56" x2="28" y2="22">
      <stop offset="0%" stop-color="#E85D3A"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="antennaGradR" x1="70" y1="56" x2="92" y2="22">
      <stop offset="0%" stop-color="#E85D3A"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>
</svg>
