name: Feature Request
description: Suggest an enhancement or new feature
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the feature you'd like
      placeholder: "I'd like..."
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Motivation
      description: Why is this feature useful? What problem does it solve?
      placeholder: "This would help with..."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of feelr would this affect?
      options:
        - "Gateway (API)"
        - CLI
        - "Connector: GitHub"
        - "Connector: Slack"
        - "Connector: Stripe"
        - "Connector: Discord"
        - Dashboard
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
      placeholder: "I considered..."
    validations:
      required: false
