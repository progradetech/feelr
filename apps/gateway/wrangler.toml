name = "feelr-gateway"
main = "src/index.ts"
compatibility_date = "2026-02-05"

# Worker Secrets (set via: npx wrangler secret put <NAME>)
# Required: ENCRYPTION_KEY, ADMIN_TOKEN
# For Slack OAuth: SLACK_CLIENT_ID, SLACK_CLIENT_SECRET

[vars]
ENVIRONMENT = "development"

# KV Namespaces
# Create with: npx wrangler kv namespace create AUTH_KV
# Then replace the placeholder ID below with the real one.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "placeholder-create-with-wrangler"

# Durable Objects
[durable_objects]
bindings = [
  { name = "TOKEN_COORDINATOR", class_name = "TokenCoordinator" }
]

# D1 Databases
# Create with: npx wrangler d1 create feelr-usage
# Then replace the placeholder ID below with the real one.
[[d1_databases]]
binding = "USAGE_DB"
database_name = "feelr-usage"
database_id = "placeholder-create-with-wrangler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenCoordinator"]

# Rate Limiting bindings (Cloudflare native, GA Sep 2025)
# Per-key tier-based rate limits
[[unsafe.bindings]]
name = "RATE_LIMIT_FREE"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMIT_PRO"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 300, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMIT_ENTERPRISE"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 3000, period = 60 }

# IP-based pre-auth defense (before API key validation)
[[unsafe.bindings]]
name = "RATE_LIMIT_IP"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 100, period = 10 }

# Cron Triggers -- daily retention cleanup at 3am UTC
[triggers]
crons = ["0 3 * * *"]
