name = "feelr-gateway"
main = "src/index.ts"
compatibility_date = "2026-02-05"

# Worker Secrets (set via: npx wrangler secret put <NAME>)
# Required: ENCRYPTION_KEY, ADMIN_TOKEN
# For Slack OAuth: SLACK_CLIENT_ID, SLACK_CLIENT_SECRET

[vars]
ENVIRONMENT = "development"

# KV Namespaces
# Create with: npx wrangler kv namespace create AUTH_KV
# Then replace the placeholder ID below with the real one.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "placeholder-create-with-wrangler"

# Durable Objects
[durable_objects]
bindings = [
  { name = "TOKEN_COORDINATOR", class_name = "TokenCoordinator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenCoordinator"]
