# Consolidated gateway deploy workflow: staging (push to main) + production (tag push)
# Replaces deploy-staging.yml and deploy-production.yml
name: Gateway

on:
  push:
    branches: [main]
    paths:
      - "apps/gateway/**"
      - "packages/**"
      - "connectors/**"
    tags:
      - "v*"

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same concurrency group as ci.yml gateway-preview to prevent staging deploy races (Pitfall 4)
    concurrency:
      group: deploy-staging
      cancel-in-progress: false # Queue deploys, never cancel mid-flight
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Deploy to staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/gateway
          command: deploy --env staging
          packageManager: pnpm

      - name: Smoke test staging
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://feelr-gateway-staging.feelr.workers.dev/health
          max-attempts: 3
          retry-delay: 5s

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production # Triggers GitHub environment approval gate
    concurrency:
      group: deploy-production
      cancel-in-progress: false # Queue deploys, never cancel mid-flight
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Deploy to production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/gateway
          command: deploy --env production
          packageManager: pnpm

      - name: Smoke test production
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://api.feelr.dev/health
          max-attempts: 5
          retry-delay: 10s
