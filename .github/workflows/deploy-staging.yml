# Deploy gateway to staging on push to main
# Triggers only when gateway-related code changes (apps/gateway, packages, connectors)
# Uses same concurrency group as ci.yml gateway-preview to prevent staging deploy races (Pitfall 4)
name: Deploy Staging

on:
  push:
    branches: [main]
    paths:
      - "apps/gateway/**"
      - "packages/**"
      - "connectors/**"

concurrency:
  group: deploy-staging
  cancel-in-progress: false # Queue deploys, never cancel mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Deploy to staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/gateway
          command: deploy --env staging
          packageManager: pnpm

      - name: Smoke test staging
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://feelr-gateway-staging.feelr.workers.dev/health
          max-attempts: 3
          retry-delay: 5s
