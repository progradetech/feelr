# Dashboard deploy workflow: staging (push to main) + production (tag push)
# Deploys Next.js static export to Azure Static Web Apps
#
# Staging: pushes to main affecting dashboard or tsconfig trigger staging deploy
# Production: v* tags trigger production deploy with GitHub environment approval gate
name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/tsconfig/**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-dashboard-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build dashboard (staging)
        run: pnpm turbo run build --filter=@feelr/dashboard
        env:
          NEXT_PUBLIC_GATEWAY_URL: https://staging-api.feelr.dev
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN_STAGING }}

      - name: Copy SWA config
        run: cp apps/dashboard/staticwebapp.config.json apps/dashboard/out/

      - name: Deploy to SWA staging
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DASHBOARD_STAGING_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/dashboard/out
          output_location: ""
          skip_app_build: true

      - name: Smoke test staging dashboard
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://staging-app.feelr.dev/health
          max-attempts: 3
          retry-delay: 5s

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-dashboard-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build dashboard (production)
        run: pnpm turbo run build --filter=@feelr/dashboard
        env:
          NEXT_PUBLIC_GATEWAY_URL: https://api.feelr.dev
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN_PRODUCTION }}

      - name: Copy SWA config
        run: cp apps/dashboard/staticwebapp.config.json apps/dashboard/out/

      - name: Deploy to SWA production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DASHBOARD_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/dashboard/out
          output_location: ""
          skip_app_build: true
