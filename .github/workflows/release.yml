# CLI releases are triggered by feelr-cloud tagging, which runs
# GoReleaser against this repo (progradetech/feelr).
#
# This workflow is manual-only to prevent double GoReleaser runs
# when the cloud-created tag triggers a second release attempt,
# causing "asset already_exists" 422 errors.
name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
