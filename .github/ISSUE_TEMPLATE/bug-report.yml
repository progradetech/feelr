name: Bug Report
description: Report a bug or unexpected behavior
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is
      placeholder: "What happened?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run `feelr ...`
        2. Send request to ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "I expected..."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of feelr is affected?
      options:
        - "Gateway (API)"
        - CLI
        - "Connector: GitHub"
        - "Connector: Slack"
        - "Connector: Stripe"
        - "Connector: Discord"
        - Dashboard
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime details that may help diagnose the issue
      placeholder: |
        - Node.js version:
        - OS:
        - CLI version:
    validations:
      required: false
