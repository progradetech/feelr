# Feelr Cloud Gateway - Multi-Environment Configuration
#
# This is the CLOUD overlay config that deploys gateway-entry.ts
# (which imports the OSS app and registers StripeBillingProvider).
#
# Deploy: npx wrangler deploy -c wrangler.cloud.toml --env staging
#         npx wrangler deploy -c wrangler.cloud.toml --env production
#
# Worker Secrets (set per-env via: npx wrangler secret put <NAME> --env <ENV>)
# Required: ENCRYPTION_KEY, ADMIN_TOKEN, STRIPE_SECRET_KEY
# For Slack OAuth: SLACK_CLIENT_ID, SLACK_CLIENT_SECRET

name = "feelr-gateway"
main = "gateway-entry.ts"
compatibility_date = "2026-02-05"

# keep_vars preserves dashboard-configured vars on deploy
keep_vars = true

# Alias stripe to the local node_modules path so esbuild can resolve it
# when bundling imports from oss/apps/gateway/src/billing/stripe/ files.
# pnpm strict mode prevents resolution from the OSS workspace; this alias
# tells wrangler's esbuild to use cloud/gateway's copy.
[alias]
"stripe" = "./node_modules/stripe/esm/stripe.esm.worker.js"

# DO migrations are top-level -- inherited by all environments
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenCoordinator"]

# Cron triggers -- daily retention cleanup at 3am UTC
[triggers]
crons = ["0 3 * * *"]

# ============================================================
# STAGING ENVIRONMENT
# Deploy: npx wrangler deploy -c wrangler.cloud.toml --env staging
# Access: https://staging-api.feelr.dev
# ============================================================
[env.staging]
workers_dev = false  # Disable .workers.dev URL -- staging uses custom domain only

[[env.staging.routes]]
pattern = "staging-api.feelr.dev"
custom_domain = true

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.kv_namespaces]]
binding = "AUTH_KV"
id = "be026de357f34093ab3c95cb587f3522"

[[env.staging.d1_databases]]
binding = "USAGE_DB"
database_name = "feelr-usage-staging"
database_id = "7a385374-3a04-48e2-902f-80e164ee0590"

[env.staging.durable_objects]
bindings = [
  { name = "TOKEN_COORDINATOR", class_name = "TokenCoordinator" }
]

[[env.staging.unsafe.bindings]]
name = "RATE_LIMIT_FREE"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 30, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RATE_LIMIT_PRO"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 300, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RATE_LIMIT_ENTERPRISE"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 3000, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RATE_LIMIT_IP"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 100, period = 10 }

# ============================================================
# PRODUCTION ENVIRONMENT
# Deploy: npx wrangler deploy -c wrangler.cloud.toml --env production
# Access: https://api.feelr.dev
# ============================================================
[env.production]
workers_dev = false  # Disable .workers.dev URL -- production uses custom domain only

[[env.production.routes]]
pattern = "api.feelr.dev"
custom_domain = true

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.kv_namespaces]]
binding = "AUTH_KV"
id = "69c0aa3763b9467fb7f5c8dc1b7a752e"

[[env.production.d1_databases]]
binding = "USAGE_DB"
database_name = "feelr-usage-production"
database_id = "3395e4fc-e9e1-4115-8762-f2bc76df8438"

[env.production.durable_objects]
bindings = [
  { name = "TOKEN_COORDINATOR", class_name = "TokenCoordinator" }
]

[[env.production.unsafe.bindings]]
name = "RATE_LIMIT_FREE"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 30, period = 60 }

[[env.production.unsafe.bindings]]
name = "RATE_LIMIT_PRO"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 300, period = 60 }

[[env.production.unsafe.bindings]]
name = "RATE_LIMIT_ENTERPRISE"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 3000, period = 60 }

[[env.production.unsafe.bindings]]
name = "RATE_LIMIT_IP"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 100, period = 10 }
