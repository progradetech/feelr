version: 2

project_name: feelr

builds:
  - id: feelr-cli
    dir: cli
    main: .
    binary: feelr
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: feelr-archive
    builds:
      - feelr-cli
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# NOTE: `brews` is deprecated since GoReleaser v2.10 in favor of `homebrew_casks`.
# Still functional; migrate when v3 deprecation is announced.
brews:
  - name: feelr
    repository:
      owner: andrewprograde
      name: homebrew-feelr
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://feelr.dev"
    description: "Agent-friendly API simplification layer CLI"
    commit_author:
      name: goreleaserbot
      email: bot@feelr.dev

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

checksum:
  name_template: checksums.txt
