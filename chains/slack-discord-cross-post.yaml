name: slack-discord-cross-post
description: >-
  Searches for messages matching a query in Slack and cross-posts the results
  to a Discord channel. Useful for bridging communication between Slack and
  Discord communities or syncing announcements across platforms.
version: "1.0"
params:
  - name: query
    type: string
    required: true
    description: Slack search query (supports Slack search modifiers like from:, in:, has:)
  - name: channel_id
    type: string
    required: true
    description: Discord channel ID to post the cross-posted messages to
  - name: count
    type: number
    required: false
    description: Maximum number of Slack messages to search for
    default: "5"
retry:
  max_attempts: 2
  delay_seconds: 3
steps:
  - id: search_slack
    uses: slack/messages.search
    with:
      query: "${{ params.query }}"
      count: "${{ params.count }}"
      sort: timestamp
  - id: post_discord
    uses: discord/messages.send
    if: "steps.search_slack.status == 'success'"
    with:
      channel_id: "${{ params.channel_id }}"
      content: "Cross-post from Slack (query: ${{ params.query }}):\n${{ steps.search_slack }}"
