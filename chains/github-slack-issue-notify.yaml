name: github-slack-issue-notify
description: >-
  Creates a GitHub issue and notifies a Slack channel with the issue details.
  Only sends the Slack notification if the issue was created successfully
  (issue number > 0). Useful for automated issue tracking workflows.
version: "1.0"
params:
  - name: repo
    type: string
    required: true
    description: GitHub repository in "owner/repo" format
  - name: title
    type: string
    required: true
    description: Title for the new GitHub issue
  - name: body
    type: string
    required: false
    description: Body text for the GitHub issue (markdown supported)
    default: ""
  - name: labels
    type: string
    required: false
    description: Comma-separated label names to apply to the issue
  - name: channel
    type: string
    required: true
    description: Slack channel ID or name (e.g. C1234567890 or #engineering)
retry:
  max_attempts: 2
  delay_seconds: 3
steps:
  - id: create_issue
    uses: github/issues.create
    with:
      repo: "${{ params.repo }}"
      title: "${{ params.title }}"
      body: "${{ params.body }}"
      labels: "${{ params.labels }}"
  - id: notify_slack
    uses: slack/messages.send
    if: "steps.create_issue.number > 0"
    with:
      channel: "${{ params.channel }}"
      text: "New issue #${{ steps.create_issue.number }} in ${{ params.repo }}: *${{ steps.create_issue.title }}*\n${{ steps.create_issue.body ?? 'No description provided' }}"
